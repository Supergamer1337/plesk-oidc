services:
  plesk:
    image: plesk/plesk:18.0
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - 127.0.0.1:${PLESK_PORT:-8443}:8443
      - 127.0.0.1:${IDP_PORT:-8080}:${IDP_PORT:-8080}
    healthcheck:
      test: ["CMD", "curl", "-fsk", "-o", "/dev/null", "https://localhost:8443/login_up.php"]
      interval: 5s
      timeout: 5s
      start_period: 5m
      start_interval: 5s

  # Shares the Plesk network namespace so the issuer URL is the same for the browser and for Plesk.
  idp:
    image: ghcr.io/navikt/mock-oauth2-server:7.0.2
    network_mode: service:plesk
    environment:
      SERVER_PORT: ${IDP_PORT:-8080}
    depends_on:
      plesk:
        condition: service_healthy
